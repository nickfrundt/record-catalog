</head>

<body>

    <main class="playground">
        <h1>Record Stack Test</h1>

        <div class="record-stack">

            <div class="record-back"></div>

            <div class="vinyl">

            </div>

            <div class="record-cover">
                <div class="cover-placeholder">

                </div>
            </div>

        </div>
    </main>
