<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Record Catalog</title>

    <link rel="stylesheet" th:href="@{/css/ui-playground.css}">
</head>

<body>

<main>

    <h1>Create Account</h1>

    <p th:if="${error}"
       th:text="${error}">
    </p>

    <form
        th:action="@{/register}"
        th:object="${user}"
        method="post">

        <label for="username">
            Username
        </label>

        <input
            id="username"
            type="text"
            th:field="*{username}"
            required>

        <br><br>

        <label for="email">
            Email
        </label>

        <input
            id="email"
            type="email"
            th:field="*{email}"
            required>

        <br><br>

        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            th:field="*{password}"
            required>

        <br><br>

        <button type="submit">
            Create Account
        </button>

    </form>

    <p>
        Already have an account?
        <a th:href="@{/login}">
            Log in
        </a>
    </p>

</main>

</body>

</html>
