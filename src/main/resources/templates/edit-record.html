<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Record</title>
</head>

<body>

    <h1>Edit Record</h1>

    <form th:action="@{/records/{id}(id=${vinylRecord.id})}"
          th:object="${vinylRecord}"
          method="post">

        <div>
            <label>Title:</label>
            <input type="text" th:field="*{title}">
        </div>

        <div>
            <label>Artist:</label>
            <input type="text" th:field="*{artist}">
        </div>

        <div>
            <label>Runtime:</label>
            <input type="number" th:field="*{runtime}">
        </div>

        <div>
            <label>Price Paid:</label>
            <input type="number" step="0.01" th:field="*{priceWhenPurchased}">
        </div>

        <div>
            <label>Release Year:</label>
            <input type="number" th:field="*{releaseYear}">
        </div>

        <div>
            <label>Condition:</label>
            <input type="text" th:field="*{condition}">
        </div>

        <div>
            <label>Owned:</label>
            <input type="checkbox" th:field="*{owned}">
        </div>

        <button type="submit">Save Changes</button>

    </form>

</body>
</html>
