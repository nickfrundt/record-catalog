<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Scan Results</title>
</head>

<body>

    <h1>Scan Results</h1>

    <div th:each="record : ${records}">

        <h2 th:text="${record.album}">
            Album Title
        </h2>

        <p th:text="${record.artist}">
            Artist
        </p>

        <p>
            Confidence:
            <span th:text="${#numbers.formatPercent(record.confidence, 1, 0)}">
                95%
            </span>
        </p>

        <hr>

</div>

</body>

</html>
