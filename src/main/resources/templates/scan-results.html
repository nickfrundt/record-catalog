<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Scan Results</title>
</head>

<body>

    <h1>Scan Results</h1>

    <!-- Show an error if something went wrong -->
    <p th:if="${error}" th:text="${error}"></p>

    <!-- Show a message if no records were found -->
    <p th:if="${records != null and #lists.isEmpty(records)}">
        No records were detected.
    </p>

    <!-- Show detected records -->
    <form
        th:if="${records != null and !#lists.isEmpty(records)}"
        action="/scan/confirm"
        method="post">

        <div th:each="record, iter : ${records}">

            <input
                type="checkbox"
                name="selectedRecords"
                th:value="${iter.index}"
                checked>

            <h2 th:text="${record.album}">
                Album Title
            </h2>

            <p th:text="${record.artist}">
                Artist
            </p>

            <p>
                Confidence:
                <span
                    th:text="${#numbers.formatPercent(record.confidence, 1, 0)}">
                    95%
                </span>
            </p>

            <hr>

        </div>

        <button type="submit">
            Add Selected Records
        </button>

    </form>

    <p>
        <a href="/scan">Scan another image</a>
    </p>

    <p>
        <a href="/records">Back to collection</a>
    </p>

</body>

</html>
