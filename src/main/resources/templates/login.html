<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Record Catalog</title>

    <link rel="stylesheet" th:href="@{/css/ui-playground.css}">
</head>

<body>

<main>

    <h1>Log In</h1>

    <p th:if="${param.error}">
        Invalid username or password.
    </p>

    <p th:if="${param.logout}">
        You have been logged out.
    </p>

    <p th:if="${param.registered}">
        Account created. You can log in now.
    </p>

    <form th:action="@{/login}" method="post">

        <label for="username">
            Username
        </label>

        <input
            id="username"
            type="text"
            name="username"
            required>

        <br><br>

        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            name="password"
            required>

        <br><br>

        <button type="submit">
            Log In
        </button>

    </form>

    <p>
        Don't have an account?
        <a th:href="@{/register}">
            Create one
        </a>
    </p>

</main>

</body>

</html>
